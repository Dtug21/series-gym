<div class="app">
  <section class="screen" id="home"></section>
  <section class="screen" id="hist" hidden></section>
  <section class="screen" id="cfg" hidden></section>
  <section class="screen" id="edit" hidden></section>
  <input type="file" id="impFile" accept="application/json,.json" hidden>
</div>

<div class="tabbar" id="tabbar"><nav>
  <button data-a="tab" data-v="home" aria-selected="true"><svg class="i"><use href="#i-dumb"/></svg>Entrenar</button>
  <button data-a="tab" data-v="hist" aria-selected="false"><svg class="i"><use href="#i-cal"/></svg>Historial</button>
  <button data-a="tab" data-v="cfg" aria-selected="false"><svg class="i"><use href="#i-gear"/></svg>Ajustes</button>
</nav></div>

<div class="player" id="player" hidden>
  <div class="ptop"><button class="x back" id="pBack" data-a="stepBack" aria-label="Retroceder"><svg class="i"><use href="#i-back"/></svg>Atrás</button><div class="ttl" id="pTtl"></div><button class="x" data-a="quit" aria-label="Salir"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div id="pRun" style="display:flex;flex-direction:column">
    <div class="pname" id="pName"></div>
    <div class="psub" id="pSub"></div>
    <div class="stage">
      <div class="bring">
        <div class="orb" id="orb"></div>
        <svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="7"/><circle id="arc" cx="60" cy="60" r="54" fill="none" stroke="#2FD3C1" stroke-width="7" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="0"/><circle id="knob" cx="114" cy="60" r="5.2" fill="#FFFFFF"/></svg>
        <div class="in"><div class="ph" id="ph"></div><div class="sec" id="sec"></div><div class="info" id="info"></div></div>
      </div>
    </div>
    <div class="plast" id="pLast"></div>
    <div class="pctl" id="pctl"></div>
  </div>
  <div class="pend" id="pEnd" hidden></div>
</div>

<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>
<div class="snack" id="snack" role="status"><span></span><button data-a="snack"></button></div>
<div class="sr" id="sr" aria-live="polite"></div>
<div class="vh" id="vh" aria-hidden="true"></div>

<script src="js/app.js?v=13"></script>
</body>
</html>
